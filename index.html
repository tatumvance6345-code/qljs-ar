<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>千里江山 AR</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
  :root { --silk: #efe8d6; --silk2: #d9cfb8; --ink: #2f3a35; --qinglv: #2a7f86; }
  html, body { margin: 0; height: 100%; background: linear-gradient(var(--silk), var(--silk2)); color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; }
  model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
  .head { position: fixed; top: 0; left: 0; right: 0; pointer-events: none;
    padding: calc(12px + env(safe-area-inset-top)) 16px 0; }
  .head h1 { margin: 0; font-size: 17px; letter-spacing: .08em; }
  .head p { margin: 4px 0 0; font-size: 12px; opacity: .7; }
  #ar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom));
    border: 0; border-radius: 999px; padding: 12px 26px; font: inherit; font-size: 15px;
    background: var(--qinglv); color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  #bar { position: fixed; left: 16px; right: 16px; top: 50%; text-align: center; font-size: 13px; opacity: .75; }
  #tip { position: fixed; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); padding: 6px 12px; border-radius: 8px; background: rgba(255,252,244,.85); bottom: calc(80px + env(safe-area-inset-bottom));
    text-align: center; font-size: 12px; } #tip:empty { display: none; }
  .wm { position: fixed; right: 12px; bottom: calc(8px + env(safe-area-inset-bottom)); font-size: 11px; opacity: .45; pointer-events: none; }
</style>
</head>
<body>
<model-viewer id="mv" src="qljs.glb" alt="千里江山图 分层群山" ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto"
  ar-placement="floor" camera-controls touch-action="pan-y" autoplay shadow-intensity="0.6"
  camera-orbit="0deg 82deg 0.95m" camera-target="0m 0.11m 0m" field-of-view="50deg" min-camera-orbit="auto auto 0.15m"
  max-camera-orbit="auto auto 2.5m" tone-mapping="none" interaction-prompt="none">
  <button slot="ar-button" id="ar">在 AR 中查看</button>
  <div slot="progress-bar"></div>
</model-viewer>
<div class="head"><h1>千里江山 · 分层群山 AR</h1><p>拖动旋转 · 双指缩放 · 点下方按钮放到桌面或地面</p></div>
<div id="bar">模型加载中…</div>
<div id="tip"></div>
<div class="wm">太阳花 · 小样</div>
<script>
  const mv = document.getElementById('mv'), bar = document.getElementById('bar'), tip = document.getElementById('tip');
  mv.addEventListener('progress', (e) => { const p = e.detail.totalProgress; bar.textContent = p < 1 ? `模型加载中… ${Math.round(p * 100)}%` : ''; });
  mv.addEventListener('load', () => {
    bar.textContent = '';
    if (!mv.canActivateAR) tip.textContent = /MicroMessenger/i.test(navigator.userAgent)
      ? '微信里打不开 AR：请点右上角「…」选择在浏览器中打开'
      : '此浏览器不支持 AR：iPhone 请用 Safari，安卓请用 Chrome';
  });
  mv.addEventListener('ar-status', (e) => { if (e.detail.status === 'failed') tip.textContent = 'AR 启动失败，请换 Safari / Chrome 再试'; });
</script>
</body>
</html>
